name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (portable + installer)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Package portable zip
        shell: pwsh
        run: |
          $release = Join-Path (Get-Location) "src-tauri\target\release"
          $files = @()
          Get-ChildItem $release -Filter *.exe -File |
            Where-Object { $_.Name -notlike '*-setup*' } |
            ForEach-Object { $files += $_.FullName }
          Get-ChildItem $release -Filter *.dll -File | ForEach-Object { $files += $_.FullName }
          if ($files.Count -eq 0) { throw "No release executable found under $release" }

          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Compress-Archive -Path $files -DestinationPath "dist-artifacts\EHDL-IDE-portable-windows-x64.zip" -Force
          Get-ChildItem dist-artifacts | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EHDL-IDE-windows
          if-no-files-found: error
          path: |
            dist-artifacts/EHDL-IDE-portable-windows-x64.zip
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-artifacts/EHDL-IDE-portable-windows-x64.zip
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
