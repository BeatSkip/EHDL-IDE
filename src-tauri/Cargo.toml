[package]
name = "ehdl-ide"
version = "0.1.0"
description = "EHDL - ECAD using HDL"
authors = ["EHDL contributors"]
edition = "2021"

# The library is what the desktop binary links against.
[lib]
name = "ehdl_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
